<!DOCTYPE html>
<html lang="pt-BR">
<head>
<style>
  .link-animado {
    position: relative;
    display: inline-block;
    text-decoration: none; /* Remove o sublinhado padrão */
    color: #1a73e8;
    font-size: 24px;
    font-family: sans-serif;
    padding-bottom: 4px; /* Espaço entre a palavra e a linha */
  }

  /* Cria a linha invisível abaixo do texto */
  .link-animado::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 2px; /* Espessura do sublinhado */
    bottom: 0;
    left: 0;
    background-color: #1a73e8; /* Cor do sublinhado */
    
    /* Começa com largura 0 (invisível) */
    transform: scaleX(0); 
    /* Define o lado de origem (esquerda) */
    transform-origin: left; 
    /* Suaviza a entrada e a saída */
    transition: transform 0.3s ease-out; 
  }

  /* Quando o mouse passa por cima */
  .link-animado:hover::after {
    transform: scaleX(1); /* Cresce até 100% da palavra */
  }
</style>
</head>
<body>

  <a href="#" class="link-animado">Passe o mouse aqui</a>

</body>
</html>
