<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="formolario.css">

</head>
<body>

  <header>
    <img src="./imagens/Eidos business presentation.png" alt="">
    <nav>
        <a href="./inicio.html" > INICIO</a>
        <a href="./servicos.html"> SERVIÇOS</a>
        <a href="local.html"> NOS ENCONTREM</a>
        <a href=""> SOBRE MIM</a>
    </nav>
</header>

  <main class="container">

    <div class="icone">
      <img src="./imagens/Eidos business presentation.png" alt="icone da luiza">
    </div>
        <h1> Bem-vindo ao Luiza Arres</h1>
        <p>para agendar um horário, por favor preencha o fórmulario que está á abaixo</p>
        <form id="formulario">

          <!-- CAMPO DE NOME -->
          <label for="nome">NOME COMPLETO: </label>
          <input type="text" id="nome" placeholder="Di gite seu nome aqui" required>

          <!-- CAMPO DE TELEFONE -->
          <label for="telefone">Telefone:</label>
          <input type="tel" placeholder="Ex: (11) 4002-8922" id="telefone" required>

          <label for="">Qual dos serviços seia?</label>
          <select id="servico">
            <option value="">selecione uma das opções</option>
            <option value="BrowLami">Brow Lamination</option>
            <option value="henna">Design com henna</option>
            <option value="sonbran">Design de sobrancelhas</option>
          </select> 

          <button type="submit">próximo</button>
        </form>

        <!-- Área do Calendário -->
        <div id="calendario" class="calendario" style="display: none;">


          <hr class="divisor">
          <h2>Escolha qual á Data você prevere</h2>
        
          <div class="cabeca-calendario">
            <button type="button" onclick="mudarMes(-1)"><</button>
            <span id="mes-ano"></span>
            <button type="button" onclick="mudarMes(1)">></button>
          </div>

          <div class="dias-semana">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>

          <div class="dias-mes" id="dias-mes"></div>

          <div id="horarios" style="display: none;">
            <h3 id="titulo-dia-selecionado"></h3>
            <div class="lista-horarios" id="lista-horarios"></div>
          </div>
        </div>
  </main>

  <script src="./formolario.js"></script>

  
</body>
</html>
