<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botão com Calendário de Agendamento</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }

    /* Estilo do Botão Principal */
    .btn-agendar {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
      transition: background 0.2s;
    }

    .btn-agendar:hover {
      background-color: #1d4ed8;
    }

    /* Fundo escuro do Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.ativo {
      display: flex;
    }

    /* Caixa do Calendário */
    .modal-calendario {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 340px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .cabecalho button {
      background: #f1f5f9;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .dias-semana, .grade-dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 4px;
    }

    .dias-semana span {
      font-size: 12px;
      font-weight: bold;
      color: #64748b;
      padding-bottom: 8px;
    }

    .dia {
      padding: 8px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .dia:hover {
      background-color: #e2e8f0;
    }

    .dia.selecionado {
      background-color: #2563eb;
      color: white;
      font-weight: bold;
    }

    /* Seção de Horários */
    .horarios {
      margin-top: 16px;
      display: none;
    }

    .horarios.visivel {
      display: block;
    }

    .lista-horarios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .slot-hora {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 13px;
    }

    .slot-hora:hover, .slot-hora.selecionado {
      background-color: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .acoes-rodape {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .btn-fechar {
      background: #e2e8f0;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-confirmar {
      background: #16a34a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Botão que dispara o calendário -->
  <button class="btn-agendar" id="btnAbrir">Agendar Horário</button>

  <!-- Modal do Calendário -->
  <div class="modal-overlay" id="modalAgendamento">
    <div class="modal-calendario">
      <div class="cabecalho">
        <button id="mesAnterior">&lt;</button>
        <strong id="mesAnoTexto"></strong>
        <button id="proximoMes">&gt;</button>
      </div>

      <div class="dias-semana">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
      </div>

      <div class="grade-dias" id="gradeDias"></div>

      <!-- Escolha de horários após clicar no dia -->
      <div class="horarios" id="secaoHorarios">
        <small><strong>Horários disponíveis:</strong></small>
        <div class="lista-horarios" id="listaHorarios">
          <button class="slot-hora">09:00</button>
          <button class="slot-hora">10:30</button>
          <button class="slot-hora">14:00</button>
          <button class="slot-hora">15:30</button>
          <button class="slot-hora">17:00</button>
        </div>
      </div>

      <div class="acoes-rodape">
        <button class="btn-fechar" id="btnFechar">Cancelar</button>
        <button class="btn-confirmar" id="btnConfirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const btnAbrir = document.getElementById('btnAbrir');
    const modal = document.getElementById('modalAgendamento');
    const btnFechar = document.getElementById('btnFechar');
    const btnConfirmar = document.getElementById('btnConfirmar');
    const gradeDias = document.getElementById('gradeDias');
    const mesAnoTexto = document.getElementById('mesAnoTexto');
    const secaoHorarios = document.getElementById('secaoHorarios');

    let dataAtual = new Date();
    let diaEscolhido = null;
    let horaEscolhida = null;

    const meses = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    function renderizarCalendario() {
      gradeDias.innerHTML = '';
      const ano = dataAtual.getFullYear();
      const mes = dataAtual.getMonth();

      mesAnoTexto.textContent = `${meses[mes]} ${ano}`;

      const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
      const ultimoDiaMes = new Date(ano, mes + 1, 0).getDate();

      // Espaços vazios antes do dia 1
      for (let i = 0; i < primeiroDiaSemana; i++) {
        gradeDias.appendChild(document.createElement('div'));
      }

      // Dias do mês
      for (let dia = 1; dia <= ultimoDiaMes; dia++) {
        const divDia = document.createElement('div');
        divDia.classList.add('dia');
        divDia.textContent = dia;

        divDia.addEventListener('click', () => {
          document.querySelectorAll('.dia').forEach(d => d.classList.remove('selecionado'));
          divDia.classList.add('selecionado');
          diaEscolhido = `${String(dia).padStart(2, '0')}/${String(mes + 1).padStart(2, '0')}/${ano}`;
          secaoHorarios.classList.add('visivel');
        });

        gradeDias.appendChild(divDia);
      }
    }

    // Seleção de horário
    document.querySelectorAll('.slot-hora').forEach(botaoHora => {
      botaoHora.addEventListener('click', () => {
        document.querySelectorAll('.slot-hora').forEach(b => b.classList.remove('selecionado'));
        botaoHora.classList.add('selecionado');
        horaEscolhida = botaoHora.textContent;
        btnConfirmar.style.display = 'inline-block';
      });
    });

    // Controles de navegação e modal
    btnAbrir.addEventListener('click', () => {
      renderizarCalendario();
      modal.classList.add('ativo');
    });

    btnFechar.addEventListener('click', () => modal.classList.remove('ativo'));

    document.getElementById('mesAnterior').addEventListener('click', () => {
      dataAtual.setMonth(dataAtual.getMonth() - 1);
      renderizarCalendario();
    });

    document.getElementById('proximoMes').addEventListener('click', () => {
      dataAtual.setMonth(dataAtual.getMonth() + 1);
      renderizarCalendario();
    });

    btnConfirmar.addEventListener('click', () => {
      btnAbrir.textContent = `Agendado: ${diaEscolhido} às ${horaEscolhida}`;
      modal.classList.remove('ativo');
    });
  </script>
</body>
</html>
